<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Timeouts Fixture: vanish</title>
</head>
<body>

  <!--
    Query params:
      vanishAt (ms, default 1500) - when int-vanish is removed from the DOM.

    Elements:
      data-testid="int-vanish" - visible at load, removed at `vanishAt` ms (AC21).
      data-testid="int-stays"  - visible at load, never removed (AC22).
  -->

  <div data-testid="int-vanish">Here for now</div>
  <div data-testid="int-stays">Always here</div>

  <script>
    function qp(name, def) {
      var v = new URLSearchParams(window.location.search).get(name);
      if (v === null || v === '') return def;
      return Number(v);
    }

    var vanishAt = qp('vanishAt', 1500);

    setTimeout(function () {
      var el = document.querySelector('[data-testid="int-vanish"]');
      if (el) el.remove();
    }, vanishAt);
  </script>

</body>
</html>
