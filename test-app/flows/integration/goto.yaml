appId: ${base}/integration
config: config.yml
# Tests: goto — navigate to a URL and verify the page loads
commands:
  - goto: ${base}/integration
  - assertUrl: /integration
  - assertVisible:
      testId: int-goto-marker
  # Navigate to a second URL and back to confirm goto works from any state
  - goto: ${base}/login
  - assertUrl: /login
  - goto: ${base}/integration
  - assertUrl: /integration
  - assertVisible:
      testId: integration-page
