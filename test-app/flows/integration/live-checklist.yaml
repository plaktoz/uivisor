appId: ${base}/integration
config: config.yml
commands:
  - setVar: target=int-tap-btn
  - runFlow: ./shared-int-setup.yaml
  - wait: 600
  - tapOn:
      testId: ${target}
  - assertVisible:
      testId: int-tap-result
  - goto: ${base}/integration-within
  - within:
      data-testid: int-within-outer
      do:
        - assertText:
            testId: int-within-deep-target
            expected: Deep target
        - within:
            data-testid: int-within-inner
            do:
              - assertText:
                  testId: int-within-deep-target
                  expected: Deep target
  - assertUrl: /integration-within
