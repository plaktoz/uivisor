appId: ${base}/integration
config: config.yml
# Main flow — tests: runFlow with child defaults, overrides, and double-calling
commands:
  - goto: ${base}/integration

  # 1. Call with child defaults
  - runFlow: ./run-flow-override-child.yaml

  # 2. Call with call-site override
  - runFlow:
      file: ./run-flow-override-child.yaml
      vars:
        textToType: Override Value 1

  # 3. Call with another call-site override (verifying double-call works)
  - runFlow:
      file: ./run-flow-override-child.yaml
      vars:
        textToType: Override Value 2
