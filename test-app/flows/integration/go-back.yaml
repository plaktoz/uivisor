appId: ${base}/integration
config: config.yml
# Tests: goBack — navigate back one step in browser history
# Uses link-click navigation (tapOn) to build a traversable history stack
commands:
  - goto: ${base}/login
  # Click through to integration so /login is in the back history
  - tapOn:
      testId: login-integration-link
  - assertUrl: /integration
  - assertVisible:
      testId: int-goto-marker
  # Navigate away via link click to create another history entry
  - tapOn:
      testId: int-nav-away-link
  - assertUrl: /login
  # Go back to integration
  - goBack: ~
  - assertUrl: /integration
  - assertVisible:
      testId: int-goto-marker
