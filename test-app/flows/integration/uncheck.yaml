appId: ${base}/integration
config: config.yml
# Tests: uncheck — uncheck a checked checkbox
commands:
  - goto: ${base}/integration
  # Verify starting state
  - assertChecked:
      testId: int-checkbox-pre-checked
  # Uncheck it
  - uncheck:
      testId: int-checkbox-pre-checked
  # Verify it is now unchecked
  - assertUnchecked:
      testId: int-checkbox-pre-checked
  # Calling uncheck on an already-unchecked box is idempotent
  - uncheck:
      testId: int-checkbox-pre-unchecked
  - assertUnchecked:
      testId: int-checkbox-pre-unchecked
